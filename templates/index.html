<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion Detector</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #eef4ff 0%, #f8f2ff 100%);
            color: #1f2937;
        }
        header {
            background: #0f62fe;
            color: white;
            padding: 22px 7%;
            box-shadow: 0 3px 12px rgba(15, 98, 254, 0.25);
        }
        header h1 { margin: 0; font-size: 28px; }
        header p { margin: 6px 0 0; opacity: 0.9; }
        main {
            width: min(900px, 90%);
            margin: 70px auto;
            background: white;
            border-radius: 18px;
            padding: 42px;
            box-shadow: 0 18px 50px rgba(31, 41, 55, 0.12);
        }
        h2 { margin-top: 0; font-size: 32px; }
        .subtitle { color: #6b7280; line-height: 1.6; }
        label { display: block; font-weight: 700; margin: 28px 0 10px; }
        textarea {
            width: 100%;
            min-height: 130px;
            resize: vertical;
            padding: 16px;
            border: 2px solid #d8dee9;
            border-radius: 10px;
            font-size: 17px;
            outline: none;
        }
        textarea:focus { border-color: #0f62fe; }
        button {
            margin-top: 18px;
            padding: 13px 22px;
            border: 0;
            border-radius: 9px;
            background: #0f62fe;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #0043ce; }
        #system_response {
            margin-top: 28px;
            padding: 18px;
            min-height: 60px;
            border-left: 5px solid #0f62fe;
            border-radius: 8px;
            background: #f4f7ff;
            line-height: 1.7;
        }
        footer { text-align: center; color: #6b7280; margin-bottom: 35px; }
    </style>
    <script src="{{ url_for('static', filename='mywebscript.js') }}" defer></script>
</head>
<body>
    <header>
        <h1>AI Emotion Detector</h1>
        <p>Powered by Watson NLP and Flask</p>
    </header>
    <main>
        <h2>Analyze the emotion in a statement</h2>
        <p class="subtitle">
            Enter an English sentence to obtain scores for anger, disgust, fear,
            joy, and sadness, along with the dominant emotion.
        </p>
        <label for="textToAnalyze">Text to analyze</label>
        <textarea id="textToAnalyze" placeholder="Example: I think I am having fun"></textarea>
        <button type="button" onclick="runEmotionAnalysis()">Run Emotion Analysis</button>
        <div id="system_response">The analysis result will appear here.</div>
    </main>
    <footer>Final Project – Emotion Detector</footer>
</body>
</html>
